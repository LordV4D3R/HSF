# ===================================================================
# CẤU HÌNH SERVER & TÀI LIỆU SWAGGER OPENAPI
# ===================================================================
server.port=8080
spring.application.name=product-catalog-api

# Đường dẫn truy cập Swagger UI trực tiếp: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================================================================
# CẤU HÌNH KẾT NỐI CƠ SỞ DỮ LIỆU SQL SERVER (DATABASE FIRST)
# ===================================================================
# Chú ý: Đổi username và password khớp với cấu hình máy SQL Server của bạn
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ProductCatalogDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourStrongPassword123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cấu hình Hibernate cho Database First (none = Không tự ý sửa schema bảng)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Hiển thị câu lệnh SQL và định dạng dễ nhìn ra console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging chi tiết tham số query
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
