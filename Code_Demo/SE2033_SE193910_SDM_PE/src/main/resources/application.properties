spring.application.name=SE2033_SE193910_SDM_PE

# ===================================================================
# Database configuration (Microsoft SQL Server)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HSF302_2026_PE_SDM;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# Server configuration
# ===================================================================
server.port=8080
server.servlet.context-path=/

# ===================================================================
# JPA / Hibernate configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
