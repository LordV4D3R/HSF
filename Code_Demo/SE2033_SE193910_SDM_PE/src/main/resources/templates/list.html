<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Device Management</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container mt-4">
    <!-- Thông báo kết quả thao tác -->
    <div th:if="${successMessage}" class="alert alert-success text-center" role="alert" th:text="${successMessage}">
        Deleted successfully
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger text-center" role="alert" th:text="${errorMessage}">
        Cannot delete an active device.
    </div>

    <div class="border p-4 mt-3 rounded">
        <h3><b>Smart Device Management</b></h3>
        <hr>

        <!-- Form tìm kiếm và nút Add New -->
        <form th:action="@{/list}" method="get">
            <div class="row mt-4 mb-3 align-items-center">
                <div class="col-auto">
                    <label for="deviceName" class="col-form-label fw-bold">Device Name:</label>
                </div>
                <div class="col-auto">
                    <input type="text" id="deviceName" name="searchName" th:value="${searchName}" class="form-control"
                           placeholder="Enter device name..." style="width: 250px;">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary" style="background-color: #1a56b6;">Search</button>
                </div>
                <div class="col text-end">
                    <a th:href="@{/add}" class="btn btn-light border" style="background-color: #e9ecef;">Add New</a>
                </div>
            </div>
        </form>

        <!-- Bảng danh sách thiết bị -->
        <table class="table table-bordered align-middle" th:if="${!#lists.isEmpty(devices)}">
            <thead class="table-light">
            <tr>
                <th class="fw-bold" style="background-color: #f2f2f2;">Code</th>
                <th class="fw-bold" style="background-color: #f2f2f2;">Device Name</th>
                <th class="fw-bold" style="background-color: #f2f2f2;">Category</th>
                <th class="fw-bold" style="background-color: #f2f2f2;">Price ($)</th>
                <th class="fw-bold" style="background-color: #f2f2f2;">Installation Date</th>
                <th class="fw-bold" style="background-color: #f2f2f2;">Status</th>
                <th class="fw-bold" style="background-color: #f2f2f2;">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dev : ${devices}">
                <td th:text="${dev.deviceCode}">DVC101</td>
                <td th:text="${dev.deviceName}">Smart Bulb A1</td>
                <td th:text="${dev.category.categoryName}">Lighting</td>
                <td th:text="${dev.price}">500</td>
                <td th:text="${#temporals.format(dev.installationDate, 'dd/MM/yyyy')}">15/05/2026</td>
                <td th:text="${dev.status == 'AC' ? 'Active' : (dev.status == 'IN' ? 'Inactive' : (dev.status == 'DR' ? 'Draft' : dev.status))}">
                    Active
                </td>
                <td>
                    <a th:href="@{/view(id=${dev.id})}">View</a> |
                    <a href="#" data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${dev.id}">Delete</a>

                    <!-- Screen 2: Confirmation Dialog for Delete -->
                    <div class="modal fade" th:id="'deleteModal' + ${dev.id}" tabindex="-1"
                         aria-labelledby="deleteModalLabel" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content text-center p-3">
                                <div class="modal-body">
                                    <h5 class="mb-4 fw-bold">Confirmation</h5>
                                    <p>Are you sure you want to delete "<span th:text="${dev.deviceName}"></span>"?</p>
                                    <form th:action="@{/delete}" method="post">
                                        <input type="hidden" name="id" th:value="${dev.id}"/>
                                        <button type="submit" class="btn btn-primary px-4" style="background-color: #1a56b6;">Yes</button>
                                        <button type="button" class="btn btn-light border px-4" data-bs-dismiss="modal">No</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <!-- Thông báo khi không có dữ liệu (Q1.1) -->
        <div th:if="${#lists.isEmpty(devices)}" class="text-center mt-4 mb-4">
            <h5 class="text-danger">No records found</h5>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
