<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Device</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container border p-4 mt-4 rounded" style="max-width: 900px;">
    <!-- Thông báo kết quả thêm mới (Q3.2) -->
    <div th:if="${successMessage}" class="alert alert-success text-center" role="alert">
        <span th:text="${successMessage}">Created new device successfully</span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger text-center" role="alert">
        <span th:text="${errorMessage}">Failed to add device.</span>
    </div>

    <h3><b>Add New Device</b></h3>
    <hr>

    <form th:action="@{/add}" method="post" th:object="${device}">
        <div class="row mt-4">
            <div class="col-md-6">
                <label for="deviceCode" class="fw-bold">Device Code:</label>
                <input type="text" id="deviceCode" th:field="*{deviceCode}" class="form-control mt-2" placeholder="e.g. DVC101">
                <small class="text-danger" th:if="${#fields.hasErrors('deviceCode')}" th:errors="*{deviceCode}"></small>
            </div>
            <div class="col-md-6">
                <label for="category" class="fw-bold">Category:</label>
                <select id="category" th:field="*{category.id}" class="form-select mt-2"
                        style="height: 38px; border: 1px solid #ccc; border-radius: 5px; background-color: #f8f9fa;">
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.categoryName}">Lighting
                    </option>
                </select>
                <small class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <label for="deviceName" class="fw-bold">Device Name:</label>
                <input type="text" id="deviceName" th:field="*{deviceName}" class="form-control mt-2" placeholder="Enter device name...">
                <small class="text-danger" th:if="${#fields.hasErrors('deviceName')}" th:errors="*{deviceName}"></small>
            </div>
            <div class="col-md-6">
                <label for="price" class="fw-bold">Price ($):</label>
                <input type="number" step="any" id="price" th:field="*{price}" class="form-control mt-2" placeholder="e.g. 500">
                <small class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></small>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <label for="warrantyMonths" class="fw-bold">Warranty (months):</label>
                <input type="number" id="warrantyMonths" th:field="*{warrantyMonths}" class="form-control mt-2" placeholder="e.g. 12">
                <small class="text-danger" th:if="${#fields.hasErrors('warrantyMonths')}" th:errors="*{warrantyMonths}"></small>
            </div>
            <div class="col-md-6">
                <label for="installationDate" class="fw-bold">Installation Date (dd/MM/yyyy):</label>
                <input type="date" id="installationDate" th:field="*{installationDate}" class="form-control mt-2">
                <small class="text-danger" th:if="${#fields.hasErrors('installationDate')}" th:errors="*{installationDate}"></small>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-6">
                <label for="status" class="fw-bold">Status:</label>
                <select id="status" th:field="*{status}" class="form-select mt-2"
                        style="height: 38px; border: 1px solid #ccc; border-radius: 5px; background-color: #f8f9fa;">
                    <option value="AC">AC-Active</option>
                    <option value="IN">IN-Inactive</option>
                    <option value="DR">DR-Draft</option>
                </select>
                <small class="text-muted">(AC-Active, IN-Inactive, DR-Draft)</small>
                <br>
                <small class="text-danger" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col text-center">
                <button type="submit" class="btn btn-primary px-4" style="background-color: #1a56b6;">Save</button>
                <a th:href="@{/list}" class="btn btn-light border px-4">Back</a>
            </div>
        </div>
    </form>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
