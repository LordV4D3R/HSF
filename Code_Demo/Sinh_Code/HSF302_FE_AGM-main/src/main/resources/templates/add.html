<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Artifact</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container border p-4 mt-4">
    <div th:if="${successMessage}" class="alert alert-success text-center" role="alert">
        <span th:text="${successMessage}">Created new artifact successfully</span>
    </div>
    <h3>Add New Artifact</h3>
    <hr>
    <form th:action="@{/add}" method="post" th:object="${artifact}">
        <div class="row mt-4">
            <div class="col">
                <label for="artifactCode">Artifact Code:</label>
            </div>
            <div class="col">
                <label for="category">Category:</label>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col">
                <input type="text" id="artifactCode" th:field="*{artifactCode}" class="form-control">
                <small class="text-danger" th:if="${#fields.hasErrors('artifactCode')}"
                       th:errors="*{artifactCode}"></small>
            </div>
            <div class="col">
                <select id="category" th:field="*{category.id}"
                        style="width: 100%; height: 38px; border: 1px solid #ccc; border-radius: 5px; padding-left: 10px; background-color: #f8f9fa;">
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.categoryName}">Ceramics
                    </option>
                </select>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col">
                <label for="artifactName">Artifact Name:</label>
            </div>
            <div class="col">
                <label for="estimatedValue">Estimated Value ($):</label>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col">
                <input type="text" id="artifactName" th:field="*{artifactName}" class="form-control">
                <small class="text-danger" th:if="${#fields.hasErrors('artifactName')}"
                       th:errors="*{artifactName}"></small>
            </div>
            <div class="col">
                <input type="text" id="estimatedValue" th:field="*{estimatedValue}" class="form-control">
                <small class="text-danger" th:if="${#fields.hasErrors('estimatedValue')}"
                       th:errors="*{estimatedValue}"></small>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col">
                <label for="ageYears">Age (years):</label>
            </div>
            <div class="col">
                <label for="acquisitionDate">Acquisition Date (dd/MM/yyyy):</label>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col">
                <input type="text" id="ageYears" th:field="*{ageYears}" class="form-control">
                <small class="text-danger" th:if="${#fields.hasErrors('ageYears')}" th:errors="*{ageYears}"></small>
            </div>
            <div class="col">
                <input type="date" id="acquisitionDate" th:field="*{acquisitionDate}" class="form-control">
                <small class="text-danger" th:if="${#fields.hasErrors('acquisitionDate')}"
                       th:errors="*{acquisitionDate}"></small>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col">
                <label for="status">Status:</label>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-6">
                <select id="status" th:field="*{status}"
                        style="width: 100%; height: 38px; border: 1px solid #ccc; border-radius: 5px; padding-left: 10px; background-color: #f8f9fa;">
                    <option value="AC">AC-Active</option>
                    <option value="IN">IN-Inactive</option>
                    <option value="DR">DR-Draft</option>
                </select>
                <small class="text-muted">(AC-Active, IN-Inactive, DR-Draft)</small>
                <br>
                <small class="text-danger" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></small>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col text-center">
                <button type="submit" class="btn btn-primary px-4">Save</button>
                <a th:href="@{/list}" class="btn btn-light border px-4">Back</a>
            </div>
        </div>

    </form>
</div>
</body>
<script th:src="@{/js/bootstrap.min.js}"></script>
</html>
