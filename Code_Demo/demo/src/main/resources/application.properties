# ===================================================================
# CẤU HÌNH CỔNG SERVER
# ===================================================================
server.port=8080

# ===================================================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU IN-MEMORY H2
# Tự động tạo DB trong bộ nhớ RAM, lưu dữ liệu mẫu khi chạy
# ===================================================================
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Giao diện H2 Console xem trực tiếp bảng dữ liệu tại: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# CẤU HÌNH HIBERNATE / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CẤU HÌNH SWAGGER UI / SPRINGDOC OPENAPI
# ===================================================================
# Đường dẫn Swagger UI kiểm thử API trực quan: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
